# SPDX-License-Identifier: GPL-3.0-only
#
# Builds both externals on Apple Silicon, runs the bundle checks (`make test`) and
# uploads the Max package. The headless engine/editor suite is not in this tree.
name: build

on:
  workflow_dispatch:

jobs:
  build:
    # macos-15 (arm64): macos-14 images are being retired (brownouts cancel the job).
    runs-on: macos-15
    permissions:
      contents: write # the Release step on tags
    env:
      SC_TAG: Version-3.14.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The build copies the class library, plugins, sounds and libsndfile from
      # SuperCollider.app into sc3~.mxo. The 3.14.1 release publishes a universal .dmg.
      - name: Install SuperCollider 3.14.1 (bundled into sc3~)
        # Authenticated: unauthenticated API calls share 60/hour per runner IP, and a
        # rate-limited answer has no "assets" key.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/supercollider/supercollider/releases/tags/$SC_TAG")
          url=$(printf '%s' "$json" |
            python3 -c 'import json,sys; r=json.load(sys.stdin); a=r.get("assets"); sys.exit("release lookup failed: " + str(r.get("message", r))) if a is None else print(next(x["browser_download_url"] for x in a if x["name"].endswith(".dmg") and "macOS-universal" in x["name"]))')
          echo "asset: $url"
          curl -sSL "$url" -o "$RUNNER_TEMP/sc.dmg"
          mkdir -p "$RUNNER_TEMP/sc"
          hdiutil attach "$RUNNER_TEMP/sc.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/sc"
          sudo ditto "$RUNNER_TEMP/sc/SuperCollider.app" /Applications/SuperCollider.app
          hdiutil detach "$RUNNER_TEMP/sc" -force || true

      # SC's configure needs sndfile headers. Without a system libsndfile its CMake
      # falls back to an Intel-only static, and the arm64 link fails.
      - name: libsndfile for the SC build
        run: brew install libsndfile

      - name: Cache the SuperCollider sources and statics
        id: sc-cache
        uses: actions/cache@v4
        with:
          path: vendor/supercollider
          key: sc-${{ runner.arch }}-${{ env.SC_TAG }}-${{ hashFiles('source/scripts/build_sc.sh') }}

      - name: Build the pinned SuperCollider statics
        if: steps.sc-cache.outputs.cache-hit != 'true'
        run: make sc SC_TAG="$SC_TAG"

      - name: Build and check the externals
        run: make test

      - name: Package
        run: |
          set -euo pipefail
          pkg="${GITHUB_REPOSITORY#*/}"
          mkdir -p "dist/$pkg"
          cp -a package-info.json README.md LICENSE licenses externals help docs examples "dist/$pkg/"
          (cd dist && zip -qry "$pkg-${GITHUB_SHA::7}.zip" "$pkg")

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
